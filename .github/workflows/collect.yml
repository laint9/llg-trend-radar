name: Thu thập trending hằng ngày

on:
  schedule:
    - cron: "0 0 * * *"   # 07:00 giờ Việt Nam mỗi ngày
  workflow_dispatch:
    inputs:
      force_ai:
        description: "Bắt buộc chạy lại AI cho cả ngày/tuần/tháng"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Thu thập & tổng hợp
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AI_PROVIDER: ${{ vars.AI_PROVIDER }}
          AI_MODEL: ${{ vars.AI_MODEL }}
        run: node scripts/collect.mjs ${{ inputs.force_ai && '--force-ai' || '' }}

      - name: Commit dữ liệu mới (Netlify sẽ tự deploy)
        run: |
          git config user.name "trend-bot"
          git config user.email "trend-bot@users.noreply.github.com"
          git add public/data
          if git diff --cached --quiet; then
            echo "Không có thay đổi."
          else
            git commit -m "data: cập nhật trending $(TZ=Asia/Ho_Chi_Minh date +%F)"
            git push
          fi
